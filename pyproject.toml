[project]
name = "procareberry"
version = "0.1.0"
description = "Recorded Procare activities synced to Huckleberry"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = ["aiohttp==3.13.3", "huckleberry-api==0.4.8"]

[project.scripts]
procareberry = "procareberry.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.14.0"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
